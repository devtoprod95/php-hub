# ----------------------------------------
# 4. 8084 포트 -> PHP 8.3 라라벨 전용 (SSL)
# ----------------------------------------
server {
    listen 8084 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost+2.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;

    root /var/www/html/php83/laravel/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php83:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public$fastcgi_script_name;
        
        # 💡 라라벨은 자체적(storage/logs/laravel.log)으로 에러를 관리하므로 따로 지정하지 않습니다.
    }
}