# ----------------------------------------
# 1. 8074 포트 -> PHP 7.4 컨테이너 (SSL)
# ----------------------------------------
server {
    listen 8074 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost+2.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;

    root /var/www/html/php74;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php74:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        
        # ⚠️ [추가] 이 포트로 들어오는 에러는 해당 폴더의 php_error.log에 기록
        fastcgi_param PHP_VALUE "error_log=/var/www/html/php74/php_error.log";
    }
}

# ⭐ [추가] PHP 7.4 Swoole 보안 웹소켓 프록시 (WSS)
server {
    listen 9574 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost+2.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;

    location / {
        proxy_pass http://php74:9574;
        
        # 웹소켓 프로토콜 전환을 위한 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}


