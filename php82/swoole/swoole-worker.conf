[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:swoole-websocket-82]
command=php /var/www/html/swoole/server.php
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=false
stdout_logfile=/var/www/html/swoole/swoole_access.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/swoole/swoole_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5